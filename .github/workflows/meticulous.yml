name: Meticulous Tests

on:
  push:
    branches:
      - main
  pull_request: {}
  workflow_dispatch: {}

permissions:
  actions: write
  contents: read
  issues: write
  pull-requests: write
  statuses: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build application
        env:
          METICULOUS_BUILD: "true"
        run: pnpm build

      - name: Start server in background
        env:
          PORT: 3000
          HOST: "0.0.0.0"
        run: |
          node .output/server/index.mjs &
          npx wait-on http-get://localhost:3000 --timeout 30000

      - name: Run Meticulous Tests & Report Diffs
        uses: alwaysmeticulous/report-diffs-action@v1
        with:
          api-token: ${{ secrets.METICULOUS_API_TOKEN }}
          app-url: "http://localhost:3000"
          use-deployment-url: false